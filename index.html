<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Habit Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app" id="app">

    <!-- ── HEADER ── -->
    <header class="card header-card">
      <div class="header-top">
        <div class="header-brand">
          <span class="logo">🗓️</span>
          <h1>Monthly Habit Tracker</h1>
        </div>
        <div class="header-controls">
          <select id="monthSelect"></select>
          <select id="yearSelect"></select>
          <button id="todayBtn" class="btn btn-today">📍 Today</button>
          <input id="nameInput" type="text" placeholder="Your name…" maxlength="40" />
          <button id="saveBtn" class="btn btn-primary">💾 Save</button>
          <button id="resetBtn" class="btn btn-danger">♻️ Reset</button>
          <button id="exportBtn" class="btn btn-secondary">🖨️ PDF</button>
          <button id="darkToggle" class="btn btn-icon" title="Toggle dark mode">🌙</button>
        </div>
      </div>
      <p class="quote">"Be consistent — never give up"</p>
    </header>

    <!-- ── HABIT TABLE ── -->
    <section class="card" id="habitSection">
      <div class="section-title">
        <h2>Habit Tracker</h2>
        <div id="summaryBadge" class="summary-badge"></div>
      </div>
      <div class="table-wrapper">
        <table id="habitTable">
          <thead>
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="habitBody"></tbody>
        </table>
      </div>
      <button id="addHabitBtn" class="btn-add-row" style="margin-top:12px">+ Add Habit</button>
    </section>

    <!-- ── SLEEP TRACKER ── -->
    <section class="card" id="sleepSection">
      <h2 class="section-title">Sleep Tracker</h2>
      <div id="sleepInputs" class="sleep-inputs"></div>
      <div class="chart-container">
        <canvas id="sleepChart"></canvas>
      </div>
    </section>

    <!-- ── NOTES ── -->
    <section class="card" id="notesSection">
      <h2 class="section-title">Notes</h2>
      <textarea id="notesArea" placeholder="Write your notes, reflections, goals…"></textarea>
    </section>

    <!-- ── FINANCE TRACKER ── -->
    <section class="card" id="financeSection">
      <div class="section-title">
        <h2>💰 Expense, Spend &amp; Gain Tracker</h2>
        <span id="financeBadge" class="summary-badge finance-badge"></span>
      </div>

      <div class="finance-grid">
        <!-- Income -->
        <div class="finance-group">
          <h3 class="finance-group-title income-title">💵 Income</h3>
          <div class="finance-rows" id="incomeRows"></div>
          <button id="addIncomeBtn" class="btn-add-row">+ Add Income</button>
          <div class="finance-total" id="incomeTotal">Total: ₹0</div>
        </div>

        <!-- Expenses -->
        <div class="finance-group">
          <h3 class="finance-group-title expense-title">💸 Expenses</h3>
          <div class="finance-rows" id="expenseRows"></div>
          <button id="addExpenseBtn" class="btn-add-row">+ Add Expense</button>
          <div class="finance-total" id="expenseTotal">Total: ₹0</div>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="finance-summary" id="financeSummary">
        <div class="fin-card income-card"><div class="fin-label">Total Income</div><div class="fin-value" id="finIncome">₹0</div></div>
        <div class="fin-card expense-card"><div class="fin-label">Total Expenses</div><div class="fin-value" id="finExpense">₹0</div></div>
        <div class="fin-card balance-card"><div class="fin-label">Remaining Balance</div><div class="fin-value" id="finBalance">₹0</div></div>
        <div class="fin-card savings-card"><div class="fin-label">Savings Rate</div><div class="fin-value" id="finSavings">0%</div></div>
      </div>

      <!-- Charts -->
      <div class="finance-charts">
        <div class="chart-box">
          <h4>Expense Breakdown</h4>
          <div class="chart-container"><canvas id="expensePieChart"></canvas></div>
        </div>
        <div class="chart-box">
          <h4>Income vs Expenses</h4>
          <div class="chart-container"><canvas id="incomeBarChart"></canvas></div>
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
